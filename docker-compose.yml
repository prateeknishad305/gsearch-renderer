services:
  renderer:
    build: .
    init: true
    shm_size: "1gb"
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      BROWSER_REUSE: "1"
      CHROMIUM_SOURCE: system
      CHROMIUM_PATH: /usr/bin/chromium
      API_TOKEN: ${API_TOKEN:-}
      PROXY_POOL: ${PROXY_POOL:-}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
